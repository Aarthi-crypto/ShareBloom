name: share_bloom
description: ShareBloom Flutter App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.3.3
  animations: ^2.0.11
  image_picker: ^1.2.1
  audioplayers: ^5.2.1
  url_launcher: ^6.2.5
  http: 1.6.0
  geolocator: ^10.1.0

  # Firebase Core
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.12

  # Google Sign In
  google_sign_in: ^6.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/bg1.jpg
    - assets/bg2.jpg
    - assets/bg3.jpg
    - assets/logo.jpg